# VM matrix: systemd, xfs, swap file, MangoWM from GURU, started from the console, with a French keymap.
format=1
keymap=fr-latin1
disk=/dev/disk/by-id/virtio-gi-target
filesystem=xfs
encryption=none
swap=file
init=systemd
desktop=mangowm
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-mangowm-systemd
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
