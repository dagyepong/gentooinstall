# VM matrix: OpenRC, btrfs, swap file, KDE Plasma with SDDM, NetworkManager, sudo.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=btrfs
encryption=none
swap=file
init=openrc
desktop=plasma
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-plasma-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
