# VM matrix: OpenRC, ext4, dwl (~amd64) with foot and wmenu, started from the console, with a German keymap.
format=1
keymap=de-latin1
disk=/dev/disk/by-id/virtio-gi-target
filesystem=ext4
encryption=none
swap=zram
init=openrc
desktop=dwl
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-dwl-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
