# VM matrix: the smoke setup, but the harness cuts the power halfway through the package install,
# boots the ISO again and finishes with gentooinstall --resume.
# gi-vm: interrupt-world
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=ext4
encryption=none
swap=zram
init=openrc
desktop=none
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-resume
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
