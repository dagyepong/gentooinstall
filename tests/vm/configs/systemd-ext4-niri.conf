# VM matrix: systemd, ext4, Niri from GURU, started with niri-session.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=ext4
encryption=none
swap=zram
init=systemd
desktop=niri
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-niri-systemd
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
