# VM matrix: OpenRC, xfs on LUKS2, Limine, console only, NetworkManager, zram.
# The harness types the LUKS passphrase on the serial console at boot.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=xfs
encryption=luks2
swap=zram
init=openrc
desktop=none
bootloader=limine
kernel=gentoo-kernel-bin
network=networkmanager
binpkgs=yes
sshd=yes
hostname=gi-limine-openrc-luks
timezone=UTC
locales=en_US.UTF-8
root=password
users=tester
user.tester.admin=yes
user.tester.shell=bash
privilege=sudo
mirror=cdn
