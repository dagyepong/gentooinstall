# VM matrix: OpenRC, btrfs, Budgie 10.10 from SarahMiaOverlay with LightDM, UK keyboard (Budgie reads /etc/default/keyboard without locale1).
format=1
keymap=uk
disk=/dev/disk/by-id/virtio-gi-target
filesystem=btrfs
encryption=none
swap=file
init=openrc
desktop=budgie
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-budgie-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
