# VM matrix: OpenRC, ext4, Xfce with LightDM through display-manager-init.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=ext4
encryption=none
swap=zram
init=openrc
desktop=xfce
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-xfce-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
