# VM matrix: OpenRC, xfs, dwm with st and dmenu, started from the console with PipeWire's launcher.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=xfs
encryption=none
swap=zram
init=openrc
desktop=dwm
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-dwm-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
