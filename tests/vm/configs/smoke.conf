# VM smoke test: OpenRC, ext4, console only, systemd-boot, NetworkManager, no LUKS,
# one admin user, binary packages. sshd is on because the harness logs in over ssh.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=ext4
encryption=none
swap=zram
init=openrc
desktop=none
bootloader=systemd-boot
kernel=gentoo-kernel-bin
network=networkmanager
binpkgs=yes
sshd=yes
hostname=gi-smoke
timezone=UTC
locales=en_US.UTF-8
root=password
users=tester
user.tester.admin=yes
user.tester.shell=bash
privilege=sudo
mirror=cdn
