# VM matrix: systemd, xfs, Cinnamon with lightdm.service.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=xfs
encryption=none
swap=zram
init=systemd
desktop=cinnamon
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-cinnamon-systemd
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
