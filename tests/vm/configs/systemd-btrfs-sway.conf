# VM matrix: systemd, btrfs, Sway with foot and wmenu, started from the console.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=btrfs
encryption=none
swap=zram
init=systemd
desktop=sway
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-sway-systemd
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
