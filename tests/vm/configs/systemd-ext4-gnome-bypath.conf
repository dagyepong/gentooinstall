# VM matrix: systemd, ext4, GNOME with GDM, zram, systemd-boot. The disk has no serial, so no
# by-id link: the installer has to use its by-path name.
format=1
keymap=us
disk=/dev/disk/by-path/pci-0000:00:05.0
filesystem=ext4
encryption=none
swap=zram
init=systemd
desktop=gnome
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-gnome
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
