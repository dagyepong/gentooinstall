# VM matrix: OpenRC, xfs, GRUB, console only, dhcpcd, doas, root account locked.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=xfs
encryption=none
swap=zram
init=openrc
desktop=none
bootloader=grub
network=dhcpcd
root=locked
privilege=doas
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-grub-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
