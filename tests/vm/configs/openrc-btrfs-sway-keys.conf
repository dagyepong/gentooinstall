# VM matrix: OpenRC, btrfs, Sway with media_keys=yes: brightnessctl from GURU with its udev rule, playerctl and grim.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=btrfs
encryption=none
swap=zram
init=openrc
desktop=sway
bootloader=systemd-boot
network=networkmanager
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-sway-keys-openrc
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
media_keys=yes
