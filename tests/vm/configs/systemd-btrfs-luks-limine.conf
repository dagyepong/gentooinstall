# VM matrix: systemd, btrfs on LUKS2, swap file, Limine, console only, systemd-networkd.
# The harness types the LUKS passphrase on the serial console at boot.
format=1
keymap=us
disk=/dev/disk/by-id/virtio-gi-target
filesystem=btrfs
encryption=luks2
swap=file
init=systemd
desktop=none
bootloader=limine
network=networkd
root=password
privilege=sudo
kernel=gentoo-kernel-bin
binpkgs=yes
sshd=yes
hostname=gi-limine-luks
timezone=UTC
locales=en_US.UTF-8
users=tester
user.tester.admin=yes
user.tester.shell=bash
mirror=cdn
